name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild bzfile.sln /p:Configuration=Release /p:Platform=x86

    - name: List Files
      run: Get-ChildItem -Recurse

    - name: Upload bzfile.dll
      uses: actions/upload-artifact@v4
      with:
        name: bzfile-dll
        path: Release/bzfile.dll

    - name: Upload bzfile_replace_helper.exe
      uses: actions/upload-artifact@v4
      with:
        name: bzfile-replace-helper
        path: Release/bzfile_replace_helper.exe

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Package Release
      run: |
        mkdir release
        # Use find to be more flexible with artifact structure if it changed in v4
        find artifacts -name "bzfile.dll" -exec cp {} release/ \;
        find artifacts -name "bzfile_replace_helper.exe" -exec cp {} release/ \;
        cd release
        zip -r ../bzfile-release.zip .

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Build' }}
        files: bzfile-release.zip
        generate_release_notes: true
        make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
