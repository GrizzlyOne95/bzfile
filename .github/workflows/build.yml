name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Tag runs never cancel: a half-published release is worse than a queued one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and test bzfile
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and validate source version
        id: version
        shell: pwsh
        run: |
          $header = Get-Content -LiteralPath "include\bzfile_version.h" -Raw
          if ($header -notmatch '#define\s+BZFILE_VERSION_STRING\s+"([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "Could not resolve BZFILE_VERSION_STRING from include/bzfile_version.h."
          }
          $version = $matches[1]
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $version | Set-Content -LiteralPath VERSION.txt -Encoding ascii

          # A permanent GitHub release must be impossible to create under a tag
          # that disagrees with the version embedded in both shipped binaries.
          if ("${{ github.ref_type }}" -eq "tag") {
            $expectedTag = "v$version"
            if ("${{ github.ref_name }}" -ne $expectedTag) {
              throw "Tag/source version mismatch: tag '${{ github.ref_name }}' must be '$expectedTag'."
            }
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build Release x86
        run: msbuild bzfile.sln /p:Configuration=Release /p:Platform=x86

      - name: Verify build outputs and PE versions
        shell: pwsh
        run: |
          $sourceVersion = "${{ steps.version.outputs.version }}"
          $expectedFileVersion = "$sourceVersion.0"
          foreach ($path in @("Release\bzfile.dll", "Release\bzfile_replace_helper.exe")) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Expected build output is missing: $path"
            }
            $versionInfo = (Get-Item -LiteralPath $path).VersionInfo
            if ($versionInfo.FileVersion -ne $expectedFileVersion) {
              throw "PE FileVersion mismatch for '$path': expected '$expectedFileVersion', got '$($versionInfo.FileVersion)'."
            }
            if ($versionInfo.ProductVersion -ne $expectedFileVersion) {
              throw "PE ProductVersion mismatch for '$path': expected '$expectedFileVersion', got '$($versionInfo.ProductVersion)'."
            }
            # The numeric FILEVERSION tuple is a separate field from the
            # strings above, and it is what bzfile.GetFileVersion reports.
            $numericVersion = "{0}.{1}.{2}.{3}" -f $versionInfo.FileMajorPart, $versionInfo.FileMinorPart, $versionInfo.FileBuildPart, $versionInfo.FilePrivatePart
            if ($numericVersion -ne $expectedFileVersion) {
              throw "PE numeric FILEVERSION mismatch for '$path': expected '$expectedFileVersion', got '$numericVersion'."
            }
          }

      - name: Test deferred replacement transactions
        shell: pwsh
        run: .\tests\Test-ReplaceHelper.ps1 -HelperPath .\Release\bzfile_replace_helper.exe

      - name: Build test Lua host
        run: msbuild tests\lua_host\bzfile_lua_host.vcxproj /p:Configuration=Release /p:Platform=Win32

      - name: Test Lua API through a real Lua host
        shell: pwsh
        run: .\tests\Test-LuaHost.ps1 -HostPath .\tests\lua_host\bin\bzfile_lua_host.exe -DllPath .\Release\bzfile.dll

      - name: Test complete split suite installation through real Lua
        shell: pwsh
        run: .\tests\Test-SuiteStaging.ps1

      - name: Upload verified binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bzfile-${{ github.sha }}
          path: |
            Release/bzfile.dll
            Release/bzfile_replace_helper.exe
            VERSION.txt
          if-no-files-found: error
          retention-days: 14

  # linux.yml does not run for tags, so a release runs the host checks here.
  linux-host:
    name: Linux host checks (release gate)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run host-side Linux checks
        run: bash tests/linux/run.sh

  release:
    name: Publish versioned release
    needs: [build, linux-host]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bzfile-${{ github.sha }}
          path: artifacts

      - name: Package release and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -name 'bzfile.dll' -exec cp '{}' release/ \;
          find artifacts -name 'bzfile_replace_helper.exe' -exec cp '{}' release/ \;
          find artifacts -name 'VERSION.txt' -exec cp '{}' release/ \;
          test -f release/bzfile.dll
          test -f release/bzfile_replace_helper.exe
          test -f release/VERSION.txt
          test "v$(tr -d '\r\n' < release/VERSION.txt)" = "$GITHUB_REF_NAME"
          (cd release && sha256sum bzfile.dll bzfile_replace_helper.exe VERSION.txt > SHA256SUMS.txt)
          (cd release && zip -r ../bzfile-${GITHUB_REF_NAME}.zip bzfile.dll bzfile_replace_helper.exe VERSION.txt SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            bzfile-${{ github.ref_name }}.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
          make_latest: true
