name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test bzfile
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x86
        run: msbuild bzfile.sln /p:Configuration=Release /p:Platform=x86

      - name: Verify build outputs
        shell: pwsh
        run: |
          foreach ($path in @("Release\bzfile.dll", "Release\bzfile_replace_helper.exe")) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Expected build output is missing: $path"
            }
          }

      - name: Test deferred replacement transactions
        shell: pwsh
        run: .\tests\Test-ReplaceHelper.ps1 -HelperPath .\Release\bzfile_replace_helper.exe

      - name: Upload verified binaries
        uses: actions/upload-artifact@v4
        with:
          name: bzfile-${{ github.sha }}
          path: |
            Release/bzfile.dll
            Release/bzfile_replace_helper.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified binaries
        uses: actions/download-artifact@v4
        with:
          name: bzfile-${{ github.sha }}
          path: artifacts

      - name: Package release and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -name 'bzfile.dll' -exec cp '{}' release/ \;
          find artifacts -name 'bzfile_replace_helper.exe' -exec cp '{}' release/ \;
          test -f release/bzfile.dll
          test -f release/bzfile_replace_helper.exe
          (cd release && sha256sum bzfile.dll bzfile_replace_helper.exe > SHA256SUMS.txt)
          (cd release && zip -r ../bzfile-${GITHUB_REF_NAME}.zip bzfile.dll bzfile_replace_helper.exe SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bzfile-${{ github.ref_name }}.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
          make_latest: true
