name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild bzfile.sln /p:Configuration=Release /p:Platform=Win32

    - name: Upload bzfile.dll
      uses: actions/upload-artifact@v4
      with:
        name: bzfile-dll
        path: Release/bzfile.dll

    - name: Upload bzfile_replace_helper.exe
      uses: actions/upload-artifact@v4
      with:
        name: bzfile-replace-helper
        path: Release/bzfile_replace_helper.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Package Release
      run: |
        mkdir release
        cp artifacts/bzfile-dll/bzfile.dll release/
        cp artifacts/bzfile-replace-helper/bzfile_replace_helper.exe release/
        cd release
        zip -r ../bzfile-release.zip .

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: bzfile-release.zip
        generate_release_notes: true
