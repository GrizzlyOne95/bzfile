name: Linux Host Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-host:
    name: Linux host checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run host-side Linux checks
        run: bash tests/linux/run.sh
